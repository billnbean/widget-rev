<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Peta Progres Belajar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --bg:#e3f1ef; --card:#ffffff; --fg:#10272b; --muted:#4f6a6d; --line:#cfe3e0;
  --a:#0e8a7d; --a2:#14b8a6; --head:#0b5f58;
  --t1:#9fdcd2; --t2:#c6ece6; --td1:#7ccfc3; --td2:#a6e1d8;   /* baris tua (normal / selesai) */
  --m1:#d6f1ed; --m2:#effaf8; --md1:#b9e6df; --md2:#d8f2ee;   /* baris muda (normal / selesai) */
  --font-d:"Bricolage Grotesque","Trebuchet MS",sans-serif; --font-b:"Source Sans 3","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1718; --card:#112326; --fg:#e4f2f0; --muted:#9bbab6; --line:#2a4a4c;
  --a:#2dd4bf; --a2:#5eead4; --head:#2dd4bf;
  --t1:#1d5654; --t2:#17403f; --td1:#26706b; --td2:#1d5654;
  --m1:#143a3b; --m2:#112d2f; --md1:#1c5250; --md2:#16403f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1718; --card:#112326; --fg:#e4f2f0; --muted:#9bbab6; --line:#2a4a4c;
  --a:#2dd4bf; --a2:#5eead4; --head:#2dd4bf;
  --t1:#1d5654; --t2:#17403f; --td1:#26706b; --td2:#1d5654;
  --m1:#143a3b; --m2:#112d2f; --md1:#1c5250; --md2:#16403f; color-scheme:dark}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:14px;line-height:1.3}
/* Potret A4 diperkecil 2/3: 374 x 528 (rasio 1 : 1,414). Skala otomatis mengikuti kotak iframe. */
.w{position:absolute;top:0;left:0;width:374px;height:528px;padding:16px 14px 12px;background:var(--card);border:1.5px solid var(--a);border-radius:14px;box-shadow:0 4px 16px rgba(14,138,125,.18);transform-origin:top left;display:flex;flex-direction:column;overflow:hidden}
.head{display:flex;flex-direction:column;gap:1px}
.eye{font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
h1{font-family:var(--font-d);font-size:1.2rem;line-height:1.1;margin:0;color:var(--head)}
.sub{margin:2px 0 0;font-size:.72rem;color:var(--muted)}
.meter{display:flex;align-items:center;gap:8px;margin:9px 0 10px}
.bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .3s}
.cnt{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.g{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px;min-height:0}
.c{--c:var(--a);--x1:var(--m1);--x2:var(--m2);--d1:var(--md1);--d2:var(--md2);display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:10px;border:1.5px solid var(--c);background:linear-gradient(135deg,var(--x1),var(--x2));color:var(--fg);font:inherit;font-size:.72rem;text-align:left;cursor:pointer;min-height:0}
.c.tua{--x1:var(--t1);--x2:var(--t2);--d1:var(--td1);--d2:var(--td2)}
.c.wide{grid-column:1 / -1}
.c:focus-visible{outline:3px solid var(--fg);outline-offset:1px}
.ico{flex:none;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center}
.ico svg{width:16px;height:16px;stroke:var(--card);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.l{flex:1;line-height:1.15}
.k{flex:none;width:17px;height:17px;border-radius:50%;border:1.8px solid var(--c);background:var(--card);display:grid;place-items:center}
.c[aria-pressed="true"] .k{background:var(--a)}
.c[aria-pressed="true"] .k:after{content:"";width:8px;height:4px;border-left:2px solid var(--card);border-bottom:2px solid var(--card);transform:rotate(-45deg) translate(1px,-1px)}
.c[aria-pressed="true"]{background:linear-gradient(135deg,var(--d1),var(--d2))}
.c[aria-pressed="true"] .l{opacity:.75}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:.66rem;color:var(--muted)}
.rs{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:0;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<section class="w" id="w" aria-label="Peta Progres Belajar">
  <div class="head">
    <div class="eye">Regulasi Diri Pendidik PNF</div>
    <h1>Peta Progres Belajar</h1>
    <p class="sub">Centang modul yang sudah Anda pelajari.</p>
  </div>
  <div class="meter"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="17" aria-valuenow="0" id="bar"><i id="pb"></i></div><span class="cnt" id="pt" aria-live="polite">0 / 17</span></div>
  <div class="g" id="g"></div>
  <div class="foot"><span id="note">Progres tersimpan di peramban ini.</span><button class="rs" id="rs" type="button">Atur ulang</button></div>
</section>
<script>
var I={
 envelope:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
 quote:'<path d="M5 18v-6a4 4 0 014-4M13 18v-6a4 4 0 014-4"/><path d="M5 18h4v-4H5zM13 18h4v-4h-4z"/>',
 camera:'<path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.3"/>',
 bubble:'<path d="M5 5h14a2 2 0 012 2v8a2 2 0 01-2 2h-7l-5 4v-4H5a2 2 0 01-2-2V7a2 2 0 012-2z"/><path d="M8 10h8M8 13h5"/>',
 bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/>',
 pencil:'<path d="M4 20l1-4L16.5 4.5a2 2 0 013 3L8 19z"/><path d="M14.5 6.5l3 3"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 4.8M3.5 12l1.2 1.2L7 10.8M3.5 18l1.2 1.2L7 16.8"/>',
 clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M8.5 13l2.5 2.5 4.5-5"/>',
 books:'<path d="M4 4h4v16H4zM10 4h4v16h-4z"/><path d="M16 6l4 1-3.2 13-4-1z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
 book:'<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11M9 8h6"/>',
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h10"/>',
 help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2"/><circle cx="12" cy="17" r=".6"/>'
};
var M=[["Sampul","home",""],["Kata Pengantar","envelope",""],["Daftar Isi","menu",""],["Panduan Belajar","compass",""],
["Kompetensi & Tujuan","target",""],["Peta Konsep","map",""],["Quote Inspirasi","quote",""],["Experience","camera",""],
["Reflection","bubble",""],["Insight","bulb",""],["Practice","pencil",""],["Rangkuman","list",""],
["Evaluasi","clip",""],["Referensi","books",""],["Profil Penulis","user",""],["Glosarium","book",""],["Bantuan","help","wide"]];
/* 17 modul = 17 slide; nomor di daftar = nomor halaman (Hal. 1-17) */
var KEY="peta-progres-belajar-v17", done={}, ok=true;
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){done={};ok=false}
var g=document.getElementById("g");
M.forEach(function(m,i){
  var b=document.createElement("button"); b.type="button"; b.className="c "+m[2]+(Math.floor(i/2)%2===0?" tua":""); b.id="c"+i; /* baris 1,3,5,7,9 = tua; baris 2,4,6,8 = muda */
  b.innerHTML='<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">'+I[m[1]]+'</svg></span><span class="l"></span><span class="k"></span>';
  b.querySelector(".l").textContent=(i+1)+". "+m[0];
  b.addEventListener("click",function(){if(done[i])delete done[i];else done[i]=1;save();render();});
  g.appendChild(b);
});
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){ok=false}}
function render(){
  var n=0;
  M.forEach(function(m,i){var on=!!done[i]; if(on)n++; document.getElementById("c"+i).setAttribute("aria-pressed",on?"true":"false");});
  document.getElementById("pt").textContent=n+" / "+M.length;
  document.getElementById("pb").style.width=(n/M.length*100)+"%";
  document.getElementById("bar").setAttribute("aria-valuenow",n);
  document.getElementById("note").textContent=ok?"Progres tersimpan di peramban ini.":"Progres tidak dapat disimpan di mode ini.";
}
document.getElementById("rs").addEventListener("click",function(){done={};save();render();});
render();
var w=document.getElementById("w");
function fit(){
  var W=w.offsetWidth,H=w.offsetHeight,vw=document.documentElement.clientWidth,vh=document.documentElement.clientHeight;
  var k=Math.min(vw/W,vh/H,1.6);
  w.style.transform="scale("+k+")"; w.style.left=Math.max(0,(vw-W*k)/2)+"px"; w.style.top=Math.max(0,(vh-H*k)/2)+"px";
}
fit(); window.addEventListener("resize",fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
</script></body></html>
